name: Publish

on:
    release:
        types: [published]

jobs:
    publish:
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/pydantic-ajv
        permissions:
            contents: read
            id-token: write # PyPI trusted publishing
        steps:
            - uses: actions/checkout@v7
            - uses: astral-sh/setup-uv@v10.0.1

            - name: Check the tag matches the version
              run: |
                  version="$(uv version --short)"
                  if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
                      echo "::error::Release tag ${GITHUB_REF_NAME} doesn't match version ${version} in pyproject.toml"
                      exit 1
                  fi

            - name: Build
              run: uv build

            - name: Publish
              run: uv publish
